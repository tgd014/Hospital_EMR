<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital EMR - Staff Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f2f5f7;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        .hospital-name {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #1f4e79;
            margin-bottom: 8px;
        }

        .portal-title {
            text-align: center;
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .login-title {
            font-size: 22px;
            color: #333;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1f4e79;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;

            background: #1f4e79;
            color: white;

            border: none;
            border-radius: 5px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-button:hover {
            background: #163a5c;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #888;
        }

        .errorlist {
            color: #b00020;
            padding-left: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="hospital-name">
            Hospital EMR
        </div>

        <div class="portal-title">
            Electronic Medical Record System
        </div>

        <div class="login-title">
            Staff Login
        </div>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="login-button">
                Sign In
            </button>
        </form>

        <div class="footer">
            Authorized hospital staff only
        </div>

    </div>

</body>
</html>
