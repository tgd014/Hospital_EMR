<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital EMR - Register Patient</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6f8;
            color: #333;
        }

        .header {
            height: 65px;
            background: #1f4e79;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 30px;
        }

        .hospital-name {
            font-size: 22px;
            font-weight: bold;
        }

        .main {
            max-width: 800px;
            margin: auto;
            padding: 30px;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .buttons {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        button {
            background: #1f4e79;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel {
            padding: 12px 22px;
            border-radius: 5px;
            text-decoration: none;
            color: #555;
            border: 1px solid #ccc;
        }

        @media (max-width: 650px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="hospital-name">
            Hospital EMR
        </div>
    </header>

    <main class="main">

        <div class="form-container">

            <h1>
                Register New Patient
            </h1>

            <form method="post">

                {% csrf_token %}

                <div class="form-row">

                    <div class="field">
                        <label>Medical Record Number</label>
                        <input
                            type="text"
                            name="medical_record_number"
                            required
                        >
                    </div>

                    <div class="field">
                        <label>Date of Birth</label>
                        <input
                            type="date"
                            name="date_of_birth"
                            required
                        >
                    </div>

                    <div class="field">
                        <label>First Name</label>
                        <input
                            type="text"
                            name="first_name"
                            required
                        >
                    </div>

                    <div class="field">
                        <label>Middle Name</label>
                        <input
                            type="text"
                            name="middle_name"
                        >
                    </div>

                    <div class="field">
                        <label>Last Name</label>
                        <input
                            type="text"
                            name="last_name"
                            required
                        >
                    </div>

                    <div class="field">
                        <label>Phone</label>
                        <input
                            type="text"
                            name="phone"
                        >
                    </div>

                    <div class="field full">
                        <label>Email</label>
                        <input
                            type="email"
                            name="email"
                        >
                    </div>

                    <div class="field full">
                        <label>Address</label>
                        <textarea name="address"></textarea>
                    </div>

                </div>

                <div class="buttons">

                    <button type="submit">
                        Register Patient
                    </button>

                    <a href="/patients/" class="cancel">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>

</body>

</html>
