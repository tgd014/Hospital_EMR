{% extends "base.html" %}

{% block title %}
Register Patient - Hospital EMR
{% endblock %}

{% block content %}

<div class="container">

    <div style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    ">

        <h2 style="margin: 0;">
            Register Patient
        </h2>

        <a
            href="/patients/"
            style="
                color: #1f4e79;
                text-decoration: none;
                font-weight: bold;
            "
        >
            ← Back to Patients
        </a>

    </div>


    <div style="
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    ">

        <h3 style="
            margin-top: 0;
            color: #1f4e79;
        ">
            Patient Information
        </h3>


        <p style="
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        ">
            Enter the patient's demographic information below.
        </p>


        <form method="post">

            {% csrf_token %}


            <!-- Medical Record Number -->

            <div style="margin-bottom: 20px;">

                <label
                    for="medical_record_number"
                    style="
                        display: block;
                        font-weight: bold;
                        margin-bottom: 7px;
                    "
                >
                    Medical Record Number
                </label>

                <input
                    type="text"
                    id="medical_record_number"
                    name="medical_record_number"
                    required
                    style="
                        width: 100%;
                        box-sizing: border-box;
                        padding: 11px;
                        border: 1px solid #ccc;
                        border-radius: 5px;
                        font-size: 15px;
                    "
                >

            </div>


            <!-- Name -->

            <div style="
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            ">


                <!-- First Name -->

                <div style="margin-bottom: 20px;">

                    <label
                        for="first_name"
                        style="
                            display: block;
                            font-weight: bold;
                            margin-bottom: 7px;
                        "
                    >
                        First Name
                    </label>

                    <input
                        type="text"
                        id="first_name"
                        name="first_name"
                        required
                        style="
                            width: 100%;
                            box-sizing: border-box;
                            padding: 11px;
                            border: 1px solid #ccc;
                            border-radius: 5px;
                            font-size: 15px;
                        "
                    >

                </div>


                <!-- Middle Name -->

                <div style="margin-bottom: 20px;">

                    <label
                        for="middle_name"
                        style="
                            display: block;
                            font-weight: bold;
                            margin-bottom: 7px;
                        "
                    >
                        Middle Name
                    </label>

                    <input
                        type="text"
                        id="middle_name"
                        name="middle_name"
                        style="
                            width: 100%;
                            box-sizing: border-box;
                            padding: 11px;
                            border: 1px solid #ccc;
                            border-radius: 5px;
                            font-size: 15px;
                        "
                    >

                </div>


                <!-- Last Name -->

                <div style="margin-bottom: 20px;">

                    <label
                        for="last_name"
                        style="
                            display: block;
                            font-weight: bold;
                            margin-bottom: 7px;
                        "
                    >
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="last_name"
                        name="last_name"
                        required
                        style="
                            width: 100%;
                            box-sizing: border-box;
                            padding: 11px;
                            border: 1px solid #ccc;
                            border-radius: 5px;
                            font-size: 15px;
                        "
                    >

                </div>

            </div>


            <!-- Date of Birth -->

            <div style="margin-bottom: 20px;">

                <label
                    for="date_of_birth"
                    style="
                        display: block;
                        font-weight: bold;
                        margin-bottom: 7px;
                    "
                >
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="date_of_birth"
                    name="date_of_birth"
                    required
                    style="
                        padding: 11px;
                        border: 1px solid #ccc;
                        border-radius: 5px;
                        font-size: 15px;
                    "
                >

            </div>


            <!-- Phone and Email -->

            <div style="
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            ">


                <!-- Phone -->

                <div style="margin-bottom: 20px;">

                    <label
                        for="phone"
                        style="
                            display: block;
                            font-weight: bold;
                            margin-bottom: 7px;
                        "
                    >
                        Phone
                    </label>

                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        style="
                            width: 100%;
                            box-sizing: border-box;
                            padding: 11px;
                            border: 1px solid #ccc;
                            border-radius: 5px;
                            font-size: 15px;
                        "
                    >

                </div>


                <!-- Email -->

                <div style="margin-bottom: 20px;">

                    <label
                        for="email"
                        style="
                            display: block;
                            font-weight: bold;
                            margin-bottom: 7px;
                        "
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        style="
                            width: 100%;
                            box-sizing: border-box;
                            padding: 11px;
                            border: 1px solid #ccc;
                            border-radius: 5px;
                            font-size: 15px;
                        "
                    >

                </div>

            </div>


            <!-- Address -->

            <div style="margin-bottom: 25px;">

                <label
                    for="address"
                    style="
                        display: block;
                        font-weight: bold;
                        margin-bottom: 7px;
                    "
                >
                    Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    rows="4"
                    style="
                        width: 100%;
                        box-sizing: border-box;
                        padding: 11px;
                        border: 1px solid #ccc;
                        border-radius: 5px;
                        font-size: 15px;
                        resize: vertical;
                    "
                ></textarea>

            </div>


            <!-- Buttons -->

            <div style="
                display: flex;
                gap: 10px;
            ">

                <button
                    type="submit"
                    style="
                        background-color: #198754;
                        color: white;
                        border: none;
                        padding: 12px 20px;
                        border-radius: 6px;
                        font-size: 15px;
                        font-weight: bold;
                        cursor: pointer;
                    "
                >
                    Register Patient
                </button>


                <a
                    href="/patients/"
                    style="
                        background-color: #6c757d;
                        color: white;
                        text-decoration: none;
                        padding: 12px 20px;
                        border-radius: 6px;
                        font-size: 15px;
                    "
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
